# Verifies the Docker packaging without needing Docker on your own machine.
#
# The image is built from a checkout that contains no workspace/ directory and no
# indexed documents, so no real data is ever involved. .gitignore excludes
# workspace/ (the embedded knowledge base, every stored chat, and all generated
# files), and .dockerignore additionally keeps tests/ and files/ out of the image,
# which the Dockerfile then copies only requirements.txt, app.py, README.md,
# .streamlit/, demo_data/ and tools/.
#
# files/ and tests/ are still tracked in git: they are source material, not data.
#
# Nothing is pushed to a registry. The image exists only for the length of the job.

name: docker build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: static checks and docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyflakes

      - name: Confirm no real data can reach the image
        run: |
          set -euo pipefail
          # workspace/ holds the indexed knowledge base, every stored chat and
          # all generated .docx/.pdf files. It is git-ignored, so it must not
          # exist in a clean checkout at all.
          if [ -e workspace ]; then
            echo "::error::workspace/ is present in the checkout; real data must never be committed"
            exit 1
          fi
          # tests/ and files/ are tracked but must still be kept out of the image.
          for path in tests files; do
            if ! grep -qx "$path/" .dockerignore; then
              echo "::error::$path/ is not listed in .dockerignore"
              exit 1
            fi
          done
          echo "no real data in the checkout, and tests/ and files/ are excluded from the image"

      - name: Lint
        run: python -m pyflakes app.py

      - name: Unit tests that need no model server
        run: python -m unittest tests.test_features

      - name: Validate the compose file
        run: docker compose config --quiet

      - name: Build the image
        run: docker build --tag servant-ai:ci .

      - name: Confirm the image runs as a non-root user
        run: |
          set -euo pipefail
          uid="$(docker run --rm --entrypoint id servant-ai:ci -u)"
          echo "image runs as uid ${uid}"
          if [ "${uid}" = "0" ]; then
            echo "::error::image is running as root"
            exit 1
          fi

      - name: Confirm the healthcheck command works
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python servant-ai:ci -c \
            "import streamlit, openai, fitz, docx, PIL, numpy, httpx; print('imports ok')"

      - name: Build summary
        run: echo "Docker packaging verified on Linux; image never published."